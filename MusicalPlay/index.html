<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Style Music Player</title>

<style>

:root{
    --bg:#020617;
    --card:#0f172a;
    --glass:rgba(255,255,255,0.05);
    --accent:#1db954;
    --text:#e6eef6;
    --muted:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#020617,#001b3d);
    color:var(--text);
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

.player-app{
    width:1000px;
    height:600px;
    background:var(--glass);
    backdrop-filter:blur(20px);
    border-radius:20px;
    overflow:hidden;
    position:relative;
    border:1px solid rgba(255,255,255,0.1);
}

.topbar{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.top-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.menu-btn,
.back-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    color:white;
    cursor:pointer;
    font-size:20px;
    transition:0.3s;
}

.menu-btn:hover,
.back-btn:hover{
    background:var(--accent);
    color:black;
}

.player{
    height:calc(100% - 70px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.cover{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    animation:spin 8s linear infinite;
    animation-play-state:paused;
}

.playing{
    animation-play-state:running;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.title{
    margin-top:25px;
    font-size:28px;
    font-weight:bold;
}

.artist{
    margin-top:8px;
    color:var(--muted);
}

.progress-container{
    width:80%;
    height:8px;
    background:rgba(255,255,255,0.1);
    border-radius:10px;
    margin-top:30px;
    cursor:pointer;
    overflow:hidden;
}

.progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#1db954,#1ed760);
    transition:width 0.1s linear;
}

.time{
    width:80%;
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:12px;
    color:var(--muted);
}

.controls{
    display:flex;
    gap:20px;
    margin-top:30px;
}

.btn{
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:22px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:var(--accent);
    color:black;
    transform:scale(1.08);
}

#playBtn{
    background:var(--accent);
    color:black;
}

.vol{
    margin-top:25px;
}

#volume{
    width:220px;
}

.sidebar{
    position:absolute;
    top:0;
    right:-350px;
    width:350px;
    height:100%;
    background:#08111f;
    transition:0.4s;
    padding:20px;
    overflow-y:auto;
    z-index:100;
    border-left:1px solid rgba(255,255,255,0.08);
}

.sidebar.active{
    right:0;
}

.sidebar h2{
    margin-bottom:20px;
}

.sidebar::-webkit-scrollbar{
    width:6px;
}

.sidebar::-webkit-scrollbar-thumb{
    background:var(--accent);
    border-radius:10px;
}

.search-box{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:15px;
    background:rgba(255,255,255,0.08);
    color:white;
}

#addSongBtn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:black;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:20px;
}

.song{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px;
    margin-bottom:12px;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    cursor:pointer;
    transition:0.3s;
}

.song:hover{
    background:rgba(255,255,255,0.1);
}

.song.active{
    background:var(--accent);
    color:black;
}

.song-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.song img{
    width:50px;
    height:50px;
    border-radius:10px;
    object-fit:cover;
}

.remove-btn,
.fav-btn{
    border:none;
    background:none;
    cursor:pointer;
    font-size:18px;
}

#toast{
    position:absolute;
    bottom:20px;
    right:20px;
    background:var(--accent);
    color:black;
    padding:12px 20px;
    border-radius:12px;
    opacity:0;
    transition:0.3s;
    font-weight:bold;
    z-index:999;
}

@media(max-width:850px){

    .player-app{
        width:95%;
        height:95vh;
    }

    .sidebar{
        width:100%;
        right:-100%;
    }

    .cover{
        width:200px;
        height:200px;
    }

    .title{
        font-size:22px;
    }
}
.player{
    padding:15px;
}

.controls{
    flex-wrap:wrap;
    justify-content:center;
}
/* ================================
   MOBILE MENU + BACK BUTTON FIX
   ================================ */

@media (max-width: 850px){

    .sidebar{
        position:absolute;
        top:0;
        right:-100%;
        width:100%;
        height:100%;
        background:#08111f;
        padding:16px 14px 25px;
        overflow-y:auto;
        overflow-x:hidden;
        z-index:1000;

        transition:right .35s ease;
    }

    .sidebar.active{
        right:0;
    }

    /* MENU HEADER */
    .sidebar-header{
        width:100%;
        height:52px;

        display:flex;
        align-items:center;

        gap:10px;
        margin-bottom:14px;
    }

    /* BACK BUTTON */
    .sidebar-back-btn{
        display:flex !important;

        width:44px;
        height:44px;
        min-width:44px;
        min-height:44px;

        align-items:center;
        justify-content:center;

        border:none;
        border-radius:12px;

        background:rgba(255,255,255,0.10);
        color:#fff;

        font-size:24px;
        font-weight:bold;

        cursor:pointer;

        flex-shrink:0;

        position:relative;
        z-index:1001;

        -webkit-tap-highlight-color:transparent;
    }

    .sidebar-back-btn:active{
        transform:scale(.92);
        background:#1db954;
        color:#000;
    }

    .sidebar-header h2{
        margin:0;
        padding:0;

        font-size:22px;
        line-height:1;

        color:#fff;
    }

    /* SEARCH */
    .search-box{
        width:100%;
        height:48px;

        padding:0 14px;

        margin-bottom:12px;

        border:none;
        outline:none;
        border-radius:12px;

        background:#1b2636;
        color:#fff;

        font-size:15px;
    }

    .search-box::placeholder{
        color:#94a3b8;
    }

    /* ADD SONG BUTTON */
    #addSongBtn{
        width:100%;
        height:48px;

        margin-bottom:18px;

        border:none;
        border-radius:12px;

        background:#1db954;
        color:#000;

        font-size:15px;
        font-weight:bold;

        cursor:pointer;
    }

    #addSongBtn:active{
        transform:scale(.98);
    }

    /* SONG CARD */
    .song{
        width:100%;
        min-height:70px;

        display:flex;
        align-items:center;
        justify-content:space-between;

        padding:9px 10px;
        margin-bottom:10px;

        border-radius:14px;

        background:#151f2e;

        overflow:hidden;
    }

    .song.active{
        background:#1db954;
        color:#000;
    }

    .song-left{
        display:flex;
        align-items:center;

        gap:10px;

        min-width:0;
        flex:1;
    }

    .song img{
        width:50px;
        height:50px;
        min-width:50px;

        border-radius:9px;

        object-fit:cover;
    }

    .song-left > div{
        min-width:0;
    }

    .song-left > div > div{
        font-size:14px;
        font-weight:bold;

        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .song-left small{
        font-size:11px;
        color:#94a3b8;
    }

    .song.active small{
        color:#17351f;
    }

    /* FAVORITE + REMOVE */
    .fav-btn,
    .remove-btn{
        width:36px;
        height:36px;

        display:flex;
        align-items:center;
        justify-content:center;

        border:none;
        background:transparent;

        font-size:19px;
        cursor:pointer;

        flex-shrink:0;
    }

    /* SCROLLBAR */
    .sidebar::-webkit-scrollbar{
        width:5px;
    }

    .sidebar::-webkit-scrollbar-track{
        background:transparent;
    }

    .sidebar::-webkit-scrollbar-thumb{
        background:#1db954;
        border-radius:10px;
    }
}


/* ================================
   SMALL MOBILE
   ================================ */

@media (max-width:480px){

    .sidebar{
        padding:12px 10px 20px;
    }

    .sidebar-header{
        height:50px;
        margin-bottom:12px;
    }

    .sidebar-back-btn{
        width:42px;
        height:42px;
        min-width:42px;
        min-height:42px;

        font-size:22px;
    }

    .sidebar-header h2{
        font-size:20px;
    }

    .song{
        min-height:66px;
        padding:8px;
    }

    .song img{
        width:48px;
        height:48px;
        min-width:48px;
    }

    .fav-btn,
    .remove-btn{
        width:34px;
        height:34px;
        font-size:18px;
    }
}


/* ================================
   VERY SMALL MOBILE
   ================================ */

@media (max-width:360px){

    .sidebar{
        padding:10px 8px 18px;
    }

    .sidebar-back-btn{
        width:40px;
        height:40px;
        min-width:40px;
        min-height:40px;
    }

    .sidebar-header h2{
        font-size:19px;
    }
}

</style>
</head>
<body>

<div class="player-app">

<div class="topbar">

<div class="top-left">

<button class="back-btn" id="backBtn">
←
</button>

<div class="logo">
🎵 Music Player
</div>

</div>

<button class="menu-btn" id="menuBtn">
☰
</button>

</div>

<div class="player">

<img id="cover"
class="cover"
src="https://picsum.photos/300">

<div id="trackTitle" class="title">
No Song
</div>

<div id="trackArtist" class="artist">
Artist
</div>

<div class="progress-container"
id="progressContainer">

<div class="progress"
id="progress"></div>

</div>

<div class="time">

<span id="currentTime">
0:00
</span>

<span id="duration">
0:00
</span>

</div>

<div class="controls">

<button id="prevBtn"
class="btn">
⏮
</button>

<button id="playBtn"
class="btn">
▶
</button>

<button id="nextBtn"
class="btn">
⏭
</button>

</div>

<div class="vol">

<input type="range"
id="volume"
min="0"
max="1"
step="0.01"
value="0.8">

</div>

</div>

<div class="sidebar" id="sidebar">

<h2>
🎶 Playlist
</h2>

<input
type="text"
id="searchSong"
placeholder="Search songs..."
class="search-box">

<input type="file"
id="fileInput"
accept="audio/*"
multiple
hidden>

<button id="addSongBtn">
+ Add Songs
</button>

<div id="playlist"></div>

</div>

<div id="toast"></div>

</div>

<script>

const tracks = [

{
src:"Song/kesariya.mp3",
title:"Kesariya",
artist:"Arijit Singh",
cover:"https://img.youtube.com/vi/BddP6PYo2gs/0.jpg"
},

{
src:"Song/Tum Hi Ho.mp3",
title:"Tum Hi Ho",
artist:"Arijit Singh",
cover:"https://img.youtube.com/vi/Umqb9KENgmk/0.jpg"
},

{
src:"Song/Raataan Lambiyan.mp3",
title:"Raataan Lambiyan",
artist:"Jubin Nautiyal",
cover:"https://img.youtube.com/vi/gvyUuxdRdR4/0.jpg"
},

{
src:"Song/Apna Bana Le.mp3",
title:"Apna Bana Le",
artist:"Arijit Singh",
cover:"https://img.youtube.com/vi/ElZfdU54Cp8/0.jpg"
},

{
src:"Song/Heeriye.mp3",
title:"Heeriye",
artist:"Arijit Singh",
cover:"https://img.youtube.com/vi/RLzC55ai0eo/0.jpg"
},

{
src:"Song/Dil Meri Na Sune.mp3",
title:" Dil Meri Na Sune",
artist:"Atif Aslam",
cover:"https://i.ytimg.com/vi/YZLKoG_vhDY/maxresdefault.jpg"
},

{
src:"Song/O Maahi.mp3",
title:"O Maahi",
artist:"Arijit Singh",
cover:"https://i.ytimg.com/vi/bjfKyIAlsZs/sddefault.jpg"
},

{
src:"Song/Hangover.mp3",
title:"Hangover",
artist:"Salman Khan",
cover:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQAKhxlO2IZEgzInz_bSeisOQZuStwfXkPOdO4V4txcATB7ytfGBSJrXKi0&s=10"
},

{
src:"Song/Tu Hi Tu.mp3",
title:"Tu Hi Tu",
artist:"Salman Khan",
cover:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRSuLA5PCYpocxjLIe0v41jKNhJRitY0Qy7MMfWaDxuRe-w9mwuSIZ_aAee&s=10"
}
];
const savedTracks =
JSON.parse(localStorage.getItem("tracks"));

if(savedTracks){

savedTracks.forEach(song=>{

tracks.push(song);

});

}

let index = 0;

const audio = new Audio();
audio.volume = 0.8;

const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");
const backBtn = document.getElementById("backBtn");
const playlistEl = document.getElementById("playlist");
const playBtn = document.getElementById("playBtn");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const cover = document.getElementById("cover");
const title = document.getElementById("trackTitle");
const artist = document.getElementById("trackArtist");
const progress = document.getElementById("progress");
const progressContainer =
document.getElementById("progressContainer");
const currentTimeEl =
document.getElementById("currentTime");
const durationEl =
document.getElementById("duration");
const volume =
document.getElementById("volume");
const addSongBtn =
document.getElementById("addSongBtn");
const fileInput =
document.getElementById("fileInput");

menuBtn.onclick = ()=>{

sidebar.classList.toggle("active");

};

function loadTrack(i){

if(tracks.length===0){

title.textContent="No Songs";
artist.textContent="";
audio.src="";

return;

}

const t = tracks[i];

audio.src = t.src;

title.textContent = t.title;
artist.textContent = t.artist;

cover.src = t.cover;

document
.querySelectorAll(".song")
.forEach(s=>s.classList.remove("active"));

const active =
document.querySelectorAll(".song")[i];

if(active){

active.classList.add("active");

}

}

function renderPlaylist(){

playlistEl.innerHTML = "";

tracks.forEach((t,i)=>{

const div =
document.createElement("div");

div.classList.add("song");

if(i===index){

div.classList.add("active");

}

div.innerHTML = `

<div class="song-left">

<img src="${t.cover}">

<div>

<div>${t.title}</div>

<small>${t.artist}</small>

<br>

<small>
⏱ ${t.duration || "0:00"}
</small>

</div>

</div>

<div style="
display:flex;
align-items:center;
gap:10px;
">

<button class="fav-btn">
${t.favorite ? "❤️" : "🤍"}
</button>

<button class="remove-btn">
❌
</button>

</div>

`;

div.querySelector(".fav-btn")
.onclick = (e)=>{

e.stopPropagation();

t.favorite = !t.favorite;

savePlaylist();

renderPlaylist();

};

div.querySelector(".remove-btn")
.onclick = (e)=>{

e.stopPropagation();

tracks.splice(i,1);

if(index >= tracks.length){

index = 0;

}

savePlaylist();

renderPlaylist();

loadTrack(index);

audio.pause();

playBtn.textContent = "▶";

showToast("Song Removed ❌");

};

div.onclick = ()=>{

index = i;

loadTrack(index);

audio.play()
.catch(err=>console.log(err));

playBtn.textContent = "⏸";

showToast("Playing 🎵");

};

div.ondblclick = ()=>{

const newName =
prompt("Rename Song",t.title);

if(newName){

t.title = newName;

savePlaylist();

renderPlaylist();

showToast("Song Renamed ✏️");

}

};

playlistEl.appendChild(div);

});

}

playBtn.onclick = ()=>{

if(audio.paused){

audio.play()
.catch(err=>console.log(err));

playBtn.textContent = "⏸";

}else{

audio.pause();

playBtn.textContent = "▶";

}

};

nextBtn.onclick = ()=>{

if(tracks.length===0) return;

index = (index+1)%tracks.length;

loadTrack(index);

audio.play();

playBtn.textContent = "⏸";

};

prevBtn.onclick = ()=>{

if(tracks.length===0) return;

index =
(index-1+tracks.length)%tracks.length;

loadTrack(index);

audio.play();

playBtn.textContent = "⏸";

};

audio.addEventListener("ended",()=>{

nextBtn.click();

});

audio.addEventListener("timeupdate",()=>{

const percent =
audio.duration
? (audio.currentTime/audio.duration)*100
: 0;

progress.style.width = percent+"%";

currentTimeEl.textContent =
format(audio.currentTime);

durationEl.textContent =
format(audio.duration);

});

progressContainer.onclick = (e)=>{

const width =
progressContainer.clientWidth;

audio.currentTime =
(e.offsetX/width)*audio.duration;

};

volume.oninput = ()=>{

audio.volume = volume.value;

};

function format(t){

if(isNaN(t)) return "0:00";

let m = Math.floor(t/60);

let s = Math.floor(t%60);

return m+":"+(s<10?"0":"")+s;

}

audio.addEventListener("play",()=>{

cover.classList.remove("playing");

void cover.offsetWidth;

cover.classList.add("playing");

});

audio.addEventListener("pause",()=>{

cover.classList.remove("playing");

});

addSongBtn.onclick = ()=>{

fileInput.click();

};

fileInput.onchange = async (e)=>{

const files = [...e.target.files];

for(const file of files){

const url =
URL.createObjectURL(file);

const tempAudio =
document.createElement("audio");

tempAudio.src = url;

await new Promise(resolve=>{

tempAudio.addEventListener(
"loadedmetadata",
resolve
);

});

tracks.push({

src:url,

title:file.name.replace(
/\.[^/.]+$/,
""
),

artist:"Local File",

duration:
format(tempAudio.duration),

favorite:false,

cover:
"https://picsum.photos/300?random="
+ Math.random()

});

}

savePlaylist();

renderPlaylist();

showToast("Songs Added 🎶");

};

function savePlaylist(){

localStorage.setItem(
"tracks",
JSON.stringify(tracks)
);

}

function showToast(msg){

const toast =
document.getElementById("toast");

toast.textContent = msg;

toast.style.opacity = 1;

setTimeout(()=>{

toast.style.opacity = 0;

},2000);

}

const searchSong =
document.getElementById("searchSong");

searchSong.oninput = ()=>{

const value =
searchSong.value.toLowerCase();

document
.querySelectorAll(".song")
.forEach(song=>{

song.style.display =
song.innerText
.toLowerCase()
.includes(value)
? "flex"
: "none";

});

};

document.addEventListener(
"keydown",
(e)=>{

if(e.code==="Space"){

e.preventDefault();

playBtn.click();

}

if(e.code==="ArrowRight"){

nextBtn.click();

}

if(e.code==="ArrowLeft"){

prevBtn.click();

}

});

backBtn.onclick = ()=>{

if(sidebar.classList.contains("active")){

sidebar.classList.remove("active");

}else{

history.back();

}

};

renderPlaylist();
loadTrack(index);

</script>

</body>
</html>
